<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VBT Tracker</title>
<style>
  *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
  body{margin:0;padding:16px;background:#111418;color:#f1f5f9;max-width:460px;margin:0 auto}
  h1{font-size:20px;margin:0 0 12px;color:#38bdf8;display:flex;justify-content:space-between;align-items:center}
  .badge{font-size:13px;padding:5px 10px;border-radius:999px;font-weight:700;background:#1e293b;color:#94a3b8}
  .badge.cal{background:#713f12;color:#fde047}
  .badge.rec{background:#7f1d1d;color:#fca5a5}
  .badge.res{background:#14532d;color:#86efac}
  .grid{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-bottom:10px}
  .grid2{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-bottom:14px}
  button{border:none;border-radius:12px;padding:16px 8px;font-size:15px;font-weight:700;color:#fff;background:#1e293b;cursor:pointer;-webkit-tap-highlight-color:transparent}
  button:active{transform:scale(0.97)}
  .btn-mode{border:1px solid #334155}
  .btn-stop{background:#dc2626;font-size:17px}
  .btn-next{background:#16a34a;font-size:17px}
  .card{background:#1a2029;border:1px solid #293342;border-radius:14px;padding:16px;margin-top:8px}
  .hero-label{font-size:12px;color:#94a3b8;text-transform:uppercase;letter-spacing:.06em;text-align:center}
  .hero-val{font-size:48px;font-weight:800;color:#4ade80;text-align:center;line-height:1.1;margin:6px 0}
  .sub{font-size:14px;color:#cbd5e1;text-align:center;margin-bottom:10px}
  .stats{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:10px}
  .stat{background:#111418;border-radius:10px;padding:10px;text-align:center}
  .stat .k{font-size:11px;color:#94a3b8;text-transform:uppercase}
  .stat .v{font-size:19px;font-weight:700;margin-top:2px}
  .good{color:#4ade80}
  .warn{color:#facc15}
  .bad{color:#f87171}
  .tbl{width:100%;border-collapse:collapse;margin-top:12px;font-size:14px}
  .tbl th{font-size:11px;color:#94a3b8;text-transform:uppercase;padding:6px 8px;border-bottom:1px solid #293342;text-align:right}
  .tbl th:first-child{text-align:left}
  .tbl td{padding:7px 8px;border-bottom:1px solid #1e293b;text-align:right;font-variant-numeric:tabular-nums}
  .tbl td:first-child{text-align:left;color:#94a3b8;font-weight:600}
</style>
</head>
<body>
  <h1>VBT Tracker <span id="badge" class="badge">IDLE</span></h1>
  <div class="grid">
    <button class="btn-mode" onclick="cmd('barbell')">Barbell</button>
    <button class="btn-mode" onclick="cmd('jump')">Jump</button>
    <button class="btn-mode" onclick="cmd('sprint')">Sprint</button>
  </div>
  <div class="grid2">
    <button class="btn-stop" onclick="cmd('stop')">STOP SET</button>
    <button class="btn-next" onclick="cmd('next')">NEXT SET</button>
  </div>
  <div id="out" class="card">
    <div class="sub" style="margin:0">Tap a mode, hold still 1s for calibration, then go!</div>
  </div>
<script>
async function cmd(a){
  try{ await fetch('/cmd?a='+a); }catch(e){}
  poll();
}
function render(d){
  const b=document.getElementById('badge');
  const states=['IDLE','HOLD STILL (1s)','RECORDING','RESULTS'];
  const cls=['','cal','rec','res'];
  b.textContent=states[d.state]||'IDLE';
  b.className='badge '+(cls[d.state]||'');

  const out=document.getElementById('out');
  if(d.state===1){
    out.innerHTML='<div class="hero-val" style="font-size:28px;color:#fde047">HOLD STILL</div><div class="sub">Calibrating IMU (1s)...</div>';
    return;
  }
  if(d.state===2){
    out.innerHTML='<div class="hero-val" style="font-size:28px;color:#fca5a5">RECORDING</div><div class="sub">500 Hz active — tap STOP SET when finished</div>';
    return;
  }
  if(d.state!==3){
    out.innerHTML='<div class="sub" style="margin:0">Tap Barbell, Jump, or Sprint to start.</div>';
    return;
  }
  if(d.mode===0){
    const r=d.rep;
    if(!r.n){ out.innerHTML='<div class="hero-val warn" style="font-size:32px">0 REPS</div><div class="sub">Min depth: 10 cm</div>'; return; }
    const lossCls=r.loss>=20?'bad':(r.loss>=10?'warn':'good');
    let rows='';
    for(let i=0;i<r.list.length;i++){
      const mv=r.list[i], pk=r.pkList[i]||0;
      const drop=r.best>0?Math.max(0,(r.best-mv)/r.best*100):0;
      const c=drop>=20?'bad':(drop>=10?'warn':'good');
      rows+='<tr><td>R'+(i+1)+'</td><td><b>'+mv.toFixed(2)+'</b></td><td>'+pk.toFixed(2)+'</td><td class="'+c+'">-'+drop.toFixed(0)+'%</td></tr>';
    }
    out.innerHTML='<div class="hero-label">Barbell Set '+d.set+' ('+r.n+' Reps) — Best Mean Vel</div>'+
      '<div class="hero-val">'+r.best.toFixed(2)+' <span style="font-size:18px">m/s</span></div>'+
      '<div class="stats">'+
        '<div class="stat"><div class="k">Set Avg</div><div class="v">'+r.avg.toFixed(2)+' m/s</div></div>'+
        '<div class="stat"><div class="k">Vel Loss</div><div class="v '+lossCls+'">'+r.loss.toFixed(1)+'%</div></div>'+
        '<div class="stat"><div class="k">Peak Accel</div><div class="v">'+r.acc.toFixed(1)+' m/s²</div></div>'+
        '<div class="stat"><div class="k">Last ROM</div><div class="v">'+r.rom.toFixed(0)+' cm</div></div>'+
        '<div class="stat"><div class="k">Conc Time</div><div class="v">'+r.concMs.toFixed(0)+' ms</div></div>'+
        '<div class="stat"><div class="k">Ecc Time</div><div class="v">'+r.eccMs.toFixed(0)+' ms</div></div>'+
      '</div>'+
      '<table class="tbl"><thead><tr><th>Rep</th><th>Mean (m/s)</th><th>Peak (m/s)</th><th>Drop</th></tr></thead><tbody>'+rows+'</tbody></table>';
  } else if(d.mode===1){
    const j=d.jump;
    if(!j.n){ out.innerHTML='<div class="hero-val warn" style="font-size:32px">0 JUMPS</div><div class="sub">Stand still before jumping</div>'; return; }
    let rows='';
    for(let i=0;i<j.list.length;i++){
      const h=j.list[i];
      const pct=j.best>0?(h/j.best*100):100;
      const c=pct<90?'warn':'good';
      rows+='<tr><td>J'+(i+1)+'</td><td><b>'+h.toFixed(1)+' cm</b></td><td class="'+c+'">'+pct.toFixed(0)+'%</td></tr>';
    }
    out.innerHTML='<div class="hero-label">Jump Set '+d.set+' ('+j.n+' Jumps) — Best Height</div>'+
      '<div class="hero-val">'+j.best.toFixed(1)+' <span style="font-size:18px">cm</span></div>'+
      '<div class="stats">'+
        '<div class="stat"><div class="k">Set Avg</div><div class="v">'+j.avg.toFixed(1)+' cm</div></div>'+
        '<div class="stat"><div class="k">Last Flight</div><div class="v">'+j.flt.toFixed(0)+' ms</div></div>'+
        '<div class="stat"><div class="k">Takeoff Vel</div><div class="v">'+j.toVel.toFixed(2)+' m/s</div></div>'+
        '<div class="stat"><div class="k">Peak Vel</div><div class="v">'+j.pkVel.toFixed(2)+' m/s</div></div>'+
      '</div>'+
      '<table class="tbl"><thead><tr><th>Jump</th><th>Height</th><th>% Best</th></tr></thead><tbody>'+rows+'</tbody></table>';
  } else if(d.mode===3){
    const s=d.sprint;
    if(!s.valid||!s.n){ out.innerHTML='<div class="hero-val warn" style="font-size:32px">0 STEPS</div><div class="sub">Min 4 sprint steps</div>'; return; }
    out.innerHTML='<div class="hero-label">Sprint '+d.set+' ('+s.n+' Steps) — Mean GCT</div>'+
      '<div class="hero-val">'+s.mean.toFixed(0)+' <span style="font-size:18px">ms</span></div>'+
      '<div class="stats">'+
        '<div class="stat"><div class="k">Min GCT</div><div class="v good">'+s.min.toFixed(0)+' ms</div></div>'+
        '<div class="stat"><div class="k">Mean Flight</div><div class="v">'+s.flt.toFixed(0)+' ms</div></div>'+
        '<div class="stat"><div class="k">Step Freq</div><div class="v">'+s.freq.toFixed(2)+' Hz</div></div>'+
        '<div class="stat"><div class="k">Asymmetry</div><div class="v '+(s.asym>5?'warn':'good')+'">'+s.asym.toFixed(1)+'%</div></div>'+
        '<div class="stat"><div class="k">Contact Drift</div><div class="v '+(s.drift>5?'warn':'good')+'">'+(s.drift>=0?'+':'')+s.drift.toFixed(1)+' ms</div></div>'+
        '<div class="stat"><div class="k">Last Step</div><div class="v">'+s.last.toFixed(0)+' ms</div></div>'+
        '<div class="stat"><div class="k">Run Time</div><div class="v">'+s.durS.toFixed(2)+' s</div></div>'+
        '<div class="stat"><div class="k">Total Steps</div><div class="v">'+s.n+'</div></div>'+
      '</div>';
  }
}
async function poll(){
  try{
    const r=await fetch('/status');
    if(r.ok) render(await r.json());
  }catch(e){}
}
setInterval(poll, 700);
poll();
</script>
</body>
</html>
