<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>VBT Trace</title>
<style>
  *{box-sizing:border-box;font-family:-apple-system,BlinkMacSystemFont,Segoe UI,Roboto,sans-serif}
  body{margin:0;padding:12px;background:#0e1217;color:#f1f5f9;max-width:900px;margin:0 auto}
  .bar{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-bottom:10px}
  h1{font-size:17px;margin:0;color:#38bdf8}
  .grp{display:flex;gap:6px;flex-wrap:wrap;align-items:center}
  button,a.btn{border:1px solid #334155;border-radius:8px;padding:7px 12px;font-size:13px;font-weight:600;color:#e2e8f0;background:#1e293b;cursor:pointer;text-decoration:none}
  button.on{background:#38bdf8;color:#0e1217;border-color:#38bdf8}
  button:active,a.btn:active{transform:scale(0.97)}
  .card{background:#161c24;border:1px solid #263141;border-radius:12px;padding:10px;margin-bottom:10px}
  canvas{width:100%;height:360px;display:block;touch-action:none;cursor:grab}
  canvas:active{cursor:grabbing}
  .info{display:flex;justify-content:space-between;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px;padding:8px 10px;background:#0e1217;border-radius:8px;font-family:ui-monospace,Consolas,monospace;font-size:12px;color:#cbd5e1}
  .legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:#94a3b8;margin-top:6px;padding:0 4px}
  .dot{display:inline-block;width:9px;height:9px;border-radius:50%;margin-right:4px;vertical-align:middle}
  .tbl{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}
  .tbl th{color:#94a3b8;text-transform:uppercase;font-size:11px;text-align:left;padding:7px 6px;border-bottom:1px solid #263141}
  .tbl td{padding:7px 6px;border-bottom:1px solid #1e293b}
  .tbl tr:hover{background:#222c3a;cursor:pointer}
  .tag{display:inline-block;padding:2px 8px;border-radius:999px;font-weight:700;font-size:11px;background:#243044;color:#38bdf8}
</style>
</head>
<body>
  <div class="bar">
    <h1 id="title">Trace</h1>
    <div class="grp">
      <a class="btn" href="/">&#8592; Back</a>
      <button onclick="loadTrace()">Reload</button>
      <a class="btn" href="/trace.csv" download="vbt_trace.csv">CSV</a>
    </div>
  </div>

  <div class="bar">
    <div class="grp" id="sigBtns">
      <button id="b-az" onclick="setSig('az')">az (m/s²)</button>
      <button id="b-vz" onclick="setSig('vz')">vz (m/s)</button>
      <button id="b-pz" onclick="setSig('pz')">pz (cm)</button>
    </div>
    <div class="grp">
      <button onclick="zoom(0.55)">+</button>
      <button onclick="zoom(1.8)">&#8722;</button>
      <button onclick="fitEffort()">Effort</button>
      <button onclick="fitFull()">Full</button>
    </div>
  </div>

  <div class="card">
    <canvas id="cv"></canvas>
    <div class="legend" id="legend"></div>
    <div id="readout" class="info">Drag chart to pan • Tap/hover to inspect • Click any transition below to zoom</div>
  </div>

  <div class="card">
    <div style="font-size:12px;color:#94a3b8;margin-bottom:6px;font-weight:700">STATE TRANSITIONS</div>
    <table class="tbl">
      <thead><tr><th>Time</th><th>Δt</th><th>Transition</th><th id="thVal">Value</th></tr></thead>
      <tbody id="evBody"></tbody>
    </table>
  </div>

<script>
const MODES = {
  0: { name:'Barbell VBT', sig:'vz',
       phases:['Idle','Eccentric','Concentric'],
       band:['transparent','rgba(250,204,21,0.12)','rgba(74,222,128,0.16)'],
       dot:['#94a3b8','#facc15','#4ade80'],
       thresh:{ vz:[{v:-0.10,l:'Ecc -0.10',c:'#facc15'},{v:0.08,l:'Conc +0.08',c:'#4ade80'},{v:0.05,l:'End +0.05',c:'#f87171'}] } },
  1: { name:'Standing Jump', sig:'az',
       phases:['Idle','Propulsion','Flight'],
       band:['transparent','rgba(250,204,21,0.13)','rgba(56,189,248,0.18)'],
       dot:['#94a3b8','#facc15','#38bdf8'],
       thresh:{ az:[{v:-7.5,l:'Takeoff -7.5',c:'#38bdf8'},{v:-5.0,l:'Landing -5.0',c:'#4ade80'},{v:3.0,l:'Push +3.0',c:'#facc15'}] } },
  2: { name:'Hurdle Hops', sig:'az',
       phases:['Idle','Approach','Contact','Rebound'],
       band:['transparent','rgba(148,163,184,0.12)','rgba(74,222,128,0.16)','rgba(56,189,248,0.16)'],
       dot:['#94a3b8','#cbd5e1','#4ade80','#38bdf8'],
       thresh:{ az:[{v:15.0,l:'TD +15.0',c:'#4ade80'},{v:-7.5,l:'Freefall -7.5',c:'#38bdf8'}] } },
  3: { name:'Sprint Contact', sig:'az',
       phases:['Idle','Stance','Aerial'],
       band:['transparent','rgba(74,222,128,0.16)','rgba(56,189,248,0.13)'],
       dot:['#94a3b8','#4ade80','#38bdf8'],
       thresh:{ az:[{v:10.0,l:'TD +10.0',c:'#4ade80'},{v:-4.5,l:'ToeOff -4.5',c:'#38bdf8'}] } },
  4: { name:'Block Start', sig:'az',
       phases:['Idle','Set','Stance','Aerial'],
       band:['transparent','rgba(250,204,21,0.13)','rgba(74,222,128,0.16)','rgba(56,189,248,0.13)'],
       dot:['#94a3b8','#facc15','#4ade80','#38bdf8'],
       thresh:{ az:[{v:8.0,l:'TD +8.0',c:'#4ade80'},{v:-2.5,l:'ToeOff -2.5',c:'#38bdf8'}] } }
};

const SIG_META = {
  az: { label:'az (m/s²)', unit:'m/s²', dec:2, color:'#38bdf8' },
  vz: { label:'vz (m/s)',  unit:'m/s',  dec:2, color:'#4ade80' },
  pz: { label:'pz (cm)',   unit:'cm',   dec:1, color:'#facc15' }
};

let mode = 0, sig = 'az', data = [], events = [];
let tMin = 0, tMax = 1000, vStart = 0, vEnd = 1000;
let hoverIdx = -1, dragX = null, dragStart = 0;

const cv = document.getElementById('cv');
const ctx = cv.getContext('2d');

function setSig(s) {
  sig = s;
  ['az','vz','pz'].forEach(k => document.getElementById('b-'+k).className = (k===sig ? 'on' : ''));
  document.getElementById('thVal').textContent = SIG_META[sig].label;
  renderTable();
  draw();
}

async function loadTrace() {
  document.getElementById('readout').textContent = 'Loading trace...';
  try {
    const res = await fetch('/trace.csv');
    const txt = await res.text();
    if (!res.ok) { document.getElementById('readout').textContent = txt; return; }
    parseCsv(txt);
  } catch (e) {
    document.getElementById('readout').textContent = 'Could not load /trace.csv';
  }
}

function parseCsv(txt) {
  data = []; events = []; mode = 0;
  for (const ln of txt.trim().split('\n')) {
    if (ln.startsWith('#mode=')) { mode = parseInt(ln.slice(6), 10) || 0; continue; }
    if (ln.startsWith('t,')) continue;
    const p = ln.split(',');
    if (p.length < 7) continue;
    const row = { t:+p[0], az:+p[1], vz:+p[2], pz:+p[3], ph:+p[4], st:+p[5], ev:+p[6] };
    if (data.length && row.ph !== data[data.length-1].ph) {
      events.push({ t:row.t, from:data[data.length-1].ph, to:row.ph, row });
    }
    data.push(row);
  }
  const m = MODES[mode] || MODES[0];
  document.getElementById('title').textContent = m.name + ' (' + data.length + ' pts)';
  buildLegend(m);
  if (data.length > 1) {
    tMin = data[0].t; tMax = data[data.length-1].t;
    setSig(m.sig);
    fitEffort();
  } else {
    setSig(m.sig);
    document.getElementById('readout').textContent = 'No samples yet — run a set and tap STOP first.';
  }
}

function buildLegend(m) {
  let html = '';
  for (let i = 1; i < m.phases.length; i++) {
    html += '<span><i class="dot" style="background:' + m.dot[i] + '"></i>' + m.phases[i] + '</span>';
  }
  html += '<span><i class="dot" style="background:#64748b"></i>Stationary (bottom bar)</span>';
  document.getElementById('legend').innerHTML = html;
}

function renderTable() {
  const m = MODES[mode] || MODES[0];
  const sm = SIG_META[sig];
  const tb = document.getElementById('evBody');
  if (!events.length) {
    tb.innerHTML = '<tr><td colspan="4" style="color:#94a3b8">No state transitions recorded</td></tr>';
    return;
  }
  tb.innerHTML = events.map((e, i) => {
    const dt = i > 0 ? (e.t - events[i-1].t) + ' ms' : '—';
    const f = m.phases[e.from] || ('P'+e.from);
    const t = m.phases[e.to] || ('P'+e.to);
    return '<tr onclick="focusT(' + e.t + ')"><td>' + e.t + ' ms</td><td>' + dt + '</td>' +
      '<td><span class="tag" style="color:' + (m.dot[e.to]||'#38bdf8') + '">' + f + ' → ' + t + '</span></td>' +
      '<td>' + e.row[sig].toFixed(sm.dec) + ' ' + sm.unit + '</td></tr>';
  }).join('');
}

function fitFull() {
  vStart = tMin; vEnd = Math.max(tMin + 100, tMax);
  draw();
}

function fitEffort() {
  if (!events.length) { fitFull(); return; }
  const first = events[0].t, last = events[events.length-1].t;
  const pad = Math.max(250, (last - first) * 0.15);
  vStart = Math.max(tMin, first - pad);
  vEnd = Math.min(tMax, last + pad);
  if (vEnd - vStart < 300) { fitFull(); return; }
  draw();
}

function focusT(t) {
  const span = Math.min(tMax - tMin, 900);
  vStart = Math.max(tMin, t - span/2);
  vEnd = Math.min(tMax, vStart + span);
  vStart = Math.max(tMin, vEnd - span);
  draw();
}

function zoom(f) {
  const mid = 0.5 * (vStart + vEnd);
  const span = Math.max(120, Math.min(tMax - tMin, (vEnd - vStart) * f));
  vStart = Math.max(tMin, mid - span/2);
  vEnd = Math.min(tMax, vStart + span);
  vStart = Math.max(tMin, vEnd - span);
  draw();
}

function draw() {
  const dpr = window.devicePixelRatio || 1;
  const w = cv.clientWidth, h = cv.clientHeight;
  cv.width = Math.round(w * dpr); cv.height = Math.round(h * dpr);
  ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
  ctx.clearRect(0, 0, w, h);
  if (data.length < 2) return;

  const padL = 48, padR = 14, padT = 26, padB = 28;
  const pw = w - padL - padR, ph = h - padT - padB;
  const m = MODES[mode] || MODES[0];
  const sm = SIG_META[sig];
  const xOf = t => padL + ((t - vStart) / Math.max(1, vEnd - vStart)) * pw;

  const vis = [];
  let yMin = Infinity, yMax = -Infinity;
  for (const r of data) {
    if (r.t < vStart - 20 || r.t > vEnd + 20) continue;
    vis.push(r);
    const v = r[sig];
    if (v < yMin) yMin = v;
    if (v > yMax) yMax = v;
  }
  if (!vis.length) return;
  if (yMax - yMin < 0.4) { yMin -= 0.4; yMax += 0.4; }
  const yPad = (yMax - yMin) * 0.14;
  yMin -= yPad; yMax += yPad;
  const yOf = v => padT + (1 - (v - yMin) / (yMax - yMin)) * ph;

  // Phase bands + stationary bar
  for (let i = 0; i < vis.length - 1; i++) {
    const x1 = Math.max(padL, xOf(vis[i].t));
    const x2 = Math.min(w - padR, xOf(vis[i+1].t));
    if (x2 <= x1) continue;
    if (m.band[vis[i].ph]) {
      ctx.fillStyle = m.band[vis[i].ph];
      ctx.fillRect(x1, padT, x2 - x1, ph);
    }
    if (vis[i].st) {
      ctx.fillStyle = '#64748b';
      ctx.fillRect(x1, padT + ph - 5, x2 - x1, 5);
    }
  }

  // Grid & Y labels
  ctx.strokeStyle = '#222c3a'; ctx.lineWidth = 1;
  ctx.fillStyle = '#94a3b8'; ctx.font = '11px monospace'; ctx.textAlign = 'right';
  for (let g = 0; g <= 5; g++) {
    const v = yMin + (g / 5) * (yMax - yMin);
    const y = yOf(v);
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillText(v.toFixed(sm.dec === 2 && Math.abs(v) >= 10 ? 0 : 1), padL - 6, y + 4);
  }
  if (yMin < 0 && yMax > 0) {
    ctx.strokeStyle = '#475569'; ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(padL, yOf(0)); ctx.lineTo(w - padR, yOf(0)); ctx.stroke();
  }

  // Threshold lines for current signal
  for (const th of ((m.thresh && m.thresh[sig]) || [])) {
    if (th.v < yMin || th.v > yMax) continue;
    const y = yOf(th.v);
    ctx.save();
    ctx.strokeStyle = th.c; ctx.setLineDash([5, 4]); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(padL, y); ctx.lineTo(w - padR, y); ctx.stroke();
    ctx.fillStyle = th.c; ctx.font = '11px sans-serif'; ctx.textAlign = 'left';
    ctx.fillText(th.l, padL + 6, y - 4);
    ctx.restore();
  }

  // Single crisp signal curve
  ctx.strokeStyle = sm.color; ctx.lineWidth = 2.4;
  ctx.beginPath();
  for (let i = 0; i < vis.length; i++) {
    const x = xOf(vis[i].t), y = yOf(vis[i][sig]);
    if (i === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
  }
  ctx.stroke();

  // State transition dots directly on the curve + staggered labels
  let lastLblX = -999;
  for (const e of events) {
    if (e.t < vStart || e.t > vEnd) continue;
    const x = xOf(e.t), y = yOf(e.row[sig]);
    const col = m.dot[e.to] || '#f8fafc';
    ctx.save();
    ctx.strokeStyle = col; ctx.globalAlpha = 0.55; ctx.setLineDash([3, 3]); ctx.lineWidth = 1.2;
    ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + ph); ctx.stroke();
    ctx.globalAlpha = 1;
    ctx.fillStyle = col;
    ctx.beginPath(); ctx.arc(x, y, 5, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#0e1217'; ctx.lineWidth = 1.5; ctx.stroke();
    if (x - lastLblX > 44) {
      ctx.fillStyle = col; ctx.font = 'bold 11px sans-serif'; ctx.textAlign = 'center';
      ctx.fillText(m.phases[e.to] || ('P'+e.to), x, padT - 8);
      lastLblX = x;
    }
    ctx.restore();
  }

  // X time labels
  ctx.fillStyle = '#94a3b8'; ctx.font = '11px monospace'; ctx.textAlign = 'center';
  for (let g = 0; g <= 4; g++) {
    const t = vStart + (g / 4) * (vEnd - vStart);
    ctx.fillText(Math.round(t) + ' ms', xOf(t), h - 8);
  }

  // Crosshair
  if (hoverIdx >= 0 && hoverIdx < data.length) {
    const r = data[hoverIdx], x = xOf(r.t), y = yOf(r[sig]);
    if (x >= padL && x <= w - padR) {
      ctx.strokeStyle = '#94a3b8'; ctx.lineWidth = 1;
      ctx.beginPath(); ctx.moveTo(x, padT); ctx.lineTo(x, padT + ph); ctx.stroke();
      ctx.fillStyle = '#fff';
      ctx.beginPath(); ctx.arc(x, y, 4, 0, Math.PI * 2); ctx.fill();
    }
  }
}

function inspectX(clientX) {
  if (!data.length) return;
  const rect = cv.getBoundingClientRect();
  const padL = 48, padR = 14;
  const frac = Math.max(0, Math.min(1, (clientX - rect.left - padL) / (rect.width - padL - padR)));
  const targetT = vStart + frac * (vEnd - vStart);
  let best = 0, bestD = Infinity;
  for (let i = 0; i < data.length; i++) {
    const d = Math.abs(data[i].t - targetT);
    if (d < bestD) { bestD = d; best = i; }
  }
  hoverIdx = best;
  const r = data[best], m = MODES[mode] || MODES[0], sm = SIG_META[sig];
  document.getElementById('readout').textContent =
    't = ' + r.t + ' ms  |  ' + sm.label + ' = ' + r[sig].toFixed(sm.dec) +
    '  |  phase: ' + (m.phases[r.ph] || r.ph) + (r.st ? '  [STATIONARY]' : '');
  draw();
}

// Drag to pan + hover to inspect
cv.addEventListener('pointerdown', e => { dragX = e.clientX; dragStart = vStart; cv.setPointerCapture(e.pointerId); inspectX(e.clientX); });
cv.addEventListener('pointermove', e => {
  if (dragX !== null) {
    const dx = e.clientX - dragX;
    const span = vEnd - vStart;
    const shift = -(dx / Math.max(1, cv.clientWidth - 62)) * span;
    vStart = Math.max(tMin, Math.min(tMax - span, dragStart + shift));
    vEnd = vStart + span;
    draw();
  } else {
    inspectX(e.clientX);
  }
});
cv.addEventListener('pointerup', () => { dragX = null; });
cv.addEventListener('wheel', e => { e.preventDefault(); zoom(e.deltaY > 0 ? 1.3 : 0.75); }, { passive: false });
window.addEventListener('resize', draw);

loadTrace();
</script>
</body>
</html>
