[platformio]
default_envs = xiao_147_display
[env:xiao_147_display]
platform = espressif32 ; platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = seeed_xiao_esp32s3
framework = arduino
build_type = debug

; XIAO ESP32-S3 Plus hardware
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_build.flash_size = 16MB

board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216

board_build.partitions = default_16MB.csv
board_build.embed_txtfiles =
    web/index.html
    web/trace.html

monitor_speed = 115200
upload_speed = 921600

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -DARDUINO_USB_MODE=1
    -DBOARD_HAS_PSRAM
    -std=gnu++17
    -DUNITY_SUPPORT_64
    ; Set to 1 to enable USB Serial logs and 1 Hz telemetryTask
    -DVBT_DEBUG_SERIAL=0


build_unflags =
    -std=gnu++11

test_framework = unity
test_build_src = no
test_filter = test_*

lib_deps =
    https://github.com/Seeed-Studio/Seeed_GFX2.git
    bblanchon/ArduinoJson@^7

